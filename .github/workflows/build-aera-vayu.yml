name: Recovery Build (vayu)

on:
  workflow_dispatch:
    inputs:

      device_tree_url:
        description: "Device tree URL"
        required: true
        default: "https://github.com/RR-pixel/vayu.git"
        type: string

      device_tree_branch:
        description: "Device tree branch"
        required: true
        default: "aera-16.0"
        type: string

      vayu_kernel:
        description: "Kernel yang dipakai"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - miui

      publish_release:
        description: "Upload juga ke GitHub Release (tanpa ini hanya jadi artifact)"
        required: true
        default: false
        type: boolean

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      SYNC_URL: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: "aera-16.0"
      DEVICE_TREE_URL: ${{ inputs.device_tree_url }}
      DEVICE_TREE_BRANCH: ${{ inputs.device_tree_branch }}
      DEVICE_PATH: device/xiaomi/vayu
      DEVICE_NAME: vayu
      BUILD_TARGET: recovery
      VAYU_KERNEL_INPUT: ${{ inputs.vayu_kernel }}
      # Notifikasi Telegram opsional: isi secret TELEGRAM_BOT_TOKEN dan
      # TELEGRAM_CHAT_ID di repo kalau mau dipakai, kalau kosong dilewati.
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Jakarta

    steps:

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Create Telegram sender script
      run: |
        cat <<'EOF' > /tmp/send_msg.sh
        #!/bin/bash
        if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
          exit 0
        fi
        MSG="$(printf "$1")"
        curl -s --fail \
          -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
          -d chat_id="${TG_CHAT}" \
          -d text="$MSG" \
          -d parse_mode="Markdown" \
          -d disable_web_page_preview=true \
        > /dev/null 2>&1 || true
        EOF
        chmod +x /tmp/send_msg.sh

    - name: Select kernel
      run: |
        # Tree vayu OrangeFox memilih kernel lewat FOX_VARIANT=MIUI (prebuilt/miui/).
        # VAYU_KERNEL ikut diekspor kalau tree AERA kamu memakai nama itu.
        if [[ "${VAYU_KERNEL_INPUT}" == "miui" ]]; then
          echo "VAYU_KERNEL=miui" >> $GITHUB_ENV
          echo "FOX_VARIANT=MIUI" >> $GITHUB_ENV
        else
          echo "VAYU_KERNEL=default" >> $GITHUB_ENV
        fi
        echo "Kernel: ${VAYU_KERNEL_INPUT}"

    - name: Initialize workspace
      run: |
        /tmp/send_msg.sh "🚀 *Starting AERA build* for \`${{ env.DEVICE_NAME }}\` (\`${{ env.DEVICE_TREE_BRANCH }}\`, kernel \`${{ env.VAYU_KERNEL_INPUT }}\`)\n🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        /tmp/send_msg.sh "🧩 Preparing build environment..."
        curl -fL -O "https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh"
        sudo bash android_build_env.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Sync AERA sources and minimal manifest
      run: |
        /tmp/send_msg.sh "🌐 Syncing AERA sources..."
        mkdir ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }} && \
          cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}
        repo init --depth=1 -u ${{ env.SYNC_URL }} -b ${{ env.MANIFEST_BRANCH }}
        repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Get latest bootable/recovery commit
      id: recovery_commit
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/bootable/recovery
        RECOVERY_COMMIT=$(git rev-parse --short=7 HEAD)
        echo "RECOVERY_COMMIT=$RECOVERY_COMMIT" >> $GITHUB_OUTPUT
        echo "Latest bootable/recovery commit: $RECOVERY_COMMIT"
        /tmp/send_msg.sh "🔁 bootable/recovery: [${RECOVERY_COMMIT}](https://github.com/AERA-Recovery/android_bootable_recovery/tree/${RECOVERY_COMMIT})"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        /tmp/send_msg.sh "🌲 Cloning device tree for \`${{ env.DEVICE_NAME }}\`..."
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}
        mkdir -p ${{ env.DEVICE_PATH }}
        git clone --depth=1 ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Get latest device tree commit
      id: devtree_commit
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}
        LATEST_COMMIT=$(git rev-parse --short=7 HEAD)
        echo "LATEST_COMMIT=$LATEST_COMMIT" >> $GITHUB_OUTPUT
        echo "Latest device tree commit: $LATEST_COMMIT"
        /tmp/send_msg.sh "🌲 Device tree: [${LATEST_COMMIT}](${{ env.DEVICE_TREE_URL }}/tree/$LATEST_COMMIT)"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check kernel selection in device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}
        echo "Referensi pemilih kernel di tree:"
        if ! grep -n "FOX_VARIANT\|VAYU_KERNEL" BoardConfig.mk vendorsetup.sh device.mk 2>/dev/null; then
          echo "::warning::Tree tidak memakai FOX_VARIANT/VAYU_KERNEL, pilihan kernel tidak akan berpengaruh. Sesuaikan BoardConfig.mk atau step 'Select kernel'."
        fi
        echo
        ls -la prebuilt prebuilt/miui 2>/dev/null || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 30

    - name: Show system resources
      run: |
        /tmp/send_msg.sh "📊 Checking runner resources..."
        echo "CPU cores:"
        nproc
        echo
        echo "Memory:"
        free -h
        echo
        echo "Disk:"
        df -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        /tmp/send_msg.sh "⚙️ Starting build for \`${{ env.DEVICE_NAME }}\` (kernel \`${{ env.VAYU_KERNEL_INPUT }}\`)..."
        cd ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}

        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e

        echo "VAYU_KERNEL=${VAYU_KERNEL} FOX_VARIANT=${FOX_VARIANT:-<unset>}"

        if [[ "${{ env.MANIFEST_BRANCH }}" == *"14.1"* ]]; then
          lunch twrp_${{ env.DEVICE_NAME }}-ap2a-eng
        elif [[ "${{ env.MANIFEST_BRANCH }}" == *"16.0"* ]]; then
          lunch twrp_${{ env.DEVICE_NAME }}-bp2a-eng
        fi

        if ! mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all); then
          /tmp/send_msg.sh "❌ Build failed for \`${{ env.DEVICE_NAME }}\` (\`${{ env.DEVICE_TREE_BRANCH }}\`, kernel \`${{ env.VAYU_KERNEL_INPUT }}\`)\n🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          exit 1
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Show system resources post-build
      run: |
        echo "Memory:"
        free -h
        echo
        echo "Disk:"
        df -h
        echo
        ls -la ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/ || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: AERA-16.0-${{ env.DEVICE_NAME }}-${{ env.VAYU_KERNEL_INPUT }}-UNTESTED
        path: |
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.img
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.zip
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET }}.img
        if-no-files-found: error

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ env.DEVICE_NAME }}-${{ env.VAYU_KERNEL_INPUT }}
        path: |
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/error.log
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/verbose.log.gz
        if-no-files-found: ignore

    - name: Upload to Release
      if: ${{ inputs.publish_release }}
      uses: softprops/action-gh-release@v3
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.img
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/AERA-R*.zip
          ${{ steps.pwd.outputs.workspace-folder }}/${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET }}.img
        fail_on_unmatched_files: false
        name: ${{ env.DEVICE_NAME }}-${{ env.VAYU_KERNEL_INPUT }}-${{ env.DEVICE_TREE_BRANCH }}-${{ steps.devtree_commit.outputs.LATEST_COMMIT }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Kernel: ${{ env.VAYU_KERNEL_INPUT }}
          Target: ${{ env.BUILD_TARGET }}
          Device tree branch: ${{ env.DEVICE_TREE_BRANCH }}
          Device tree commit: [${{ steps.devtree_commit.outputs.LATEST_COMMIT }}](${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.LATEST_COMMIT }})
          bootable/recovery commit: [${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}](https://github.com/AERA-Recovery/android_bootable_recovery/tree/${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }})
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify complete
      if: success()
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        DEVICE_TREE_BROWSE_URL="${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.LATEST_COMMIT }}"
        RECOVERY_BROWSE_URL="https://github.com/AERA-Recovery/android_bootable_recovery/tree/${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}"
        /tmp/send_msg.sh "📦 *Build complete!* (kernel \`${{ env.VAYU_KERNEL_INPUT }}\`)\n🔗 [Download]($RUN_URL)\n🌲 Device tree commit: [${{ steps.devtree_commit.outputs.LATEST_COMMIT }}]($DEVICE_TREE_BROWSE_URL)\n🔁 bootable/recovery commit: [${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}]($RECOVERY_BROWSE_URL)"
