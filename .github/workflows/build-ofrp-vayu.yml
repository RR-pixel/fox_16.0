name: OFRP Builder - vayu

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Manifest branch'
        required: true
        default: '16.0'
      DEVICE_TREE:
        description: 'Device tree URL'
        required: true
        default: 'https://github.com/RR-pixel/vayu.git'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'fox_16.0'
      DEVICE_PATH:
        description: 'Device path'
        required: true
        default: 'device/xiaomi/vayu'
      DEVICE_NAME:
        description: 'Device codename'
        required: true
        default: 'vayu'
      BUILD_TARGET:
        description: 'Build target (recovery, boot, vendorboot)'
        required: true
        default: 'recovery'
      FOX_VARIANT:
        description: 'Kernel set (default or MIUI)'
        required: true
        default: 'default'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ inputs.DEVICE_PATH }}
      DEVICE_NAME: ${{ inputs.DEVICE_NAME }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      FOX_VARIANT: ${{ inputs.FOX_VARIANT }}

    steps:
      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

      - name: Swap space
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 16

      - name: Build environment
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git git-lfs curl wget python3 python-is-python3 unzip zip bc bison flex \
            build-essential gperf gcc-multilib g++-multilib lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool lz4 zstd libncurses5-dev \
            libssl-dev libxml2 libxml2-utils xsltproc rsync lzop pngcrush \
            squashfs-tools schedtool imagemagick ccache
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          git clone --depth 1 https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
          sudo bash setup/install_android_sdk.sh
          free -h
          nproc
          df -h /

      - name: Sync OrangeFox sources
        run: |
          mkdir -p ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "$HOME/fox_$MANIFEST_BRANCH"

      - name: Clone device tree
        run: |
          cd "$HOME/fox_$MANIFEST_BRANCH"
          rm -rf "$DEVICE_PATH"
          git clone --depth 1 -b "$DEVICE_TREE_BRANCH" "$DEVICE_TREE" "$DEVICE_PATH"

      - name: Build OrangeFox
        run: |
          cd "$HOME/fox_$MANIFEST_BRANCH"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          # envsetup.sh must not be sourced with errexit on
          set +e
          source build/envsetup.sh
          set -e
          lunch "twrp_${DEVICE_NAME}-bp2a-eng"
          mka adbd "${BUILD_TARGET}image" -j2

      - name: Diagnose a failed build
        if: failure()
        run: |
          free -h
          df -h /
          sudo dmesg | grep -i -E "out of memory|killed process|oom" | tail -n 10 || true

      - name: Collect output
        if: success()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$HOME/fox_$MANIFEST_BRANCH/out/target/product/$DEVICE_NAME"
          ls -al
          cp -v OrangeFox*.zip OrangeFox*.img recovery.img boot.img vendor_boot.img \
            "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ inputs.MANIFEST_BRANCH }}-${{ inputs.DEVICE_NAME }}
          path: out/
          if-no-files-found: error
